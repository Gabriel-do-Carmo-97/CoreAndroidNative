# SonarQube Configuration for CoreAndroidNative
# Configuração corporativa para análise estática e métricas de qualidade contínua

# Project identification
sonar.projectKey=CoreAndroidNative
sonar.organization=gabriel-do-carmo-97
sonar.projectName=Core Android Native
sonar.projectVersion=1.1.0

# Source code locations
sonar.sources=infra/core-common/src/main,infra/core-storage/src/main,infra/core-device/src/main,infra/core-network/src/main,infra/core-database/src/main,infra/core-location/src/main,infra/core-camera/src/main,infra/core-analytics/src/main,infra/core-testing/src/main,infra/core/src/main,bundle/persistence/src/main,bundle/networking/src/main,bundle/presentation/src/main,bundle/hardware/src/main,app/src/main
sonar.tests=infra/core-common/src/test,infra/core-storage/src/test,infra/core-device/src/test,infra/core-network/src/test,infra/core-database/src/test,infra/core-location/src/test,infra/core-camera/src/test,infra/core-analytics/src/test,infra/core-testing/src/test,infra/core/src/test,bundle/persistence/src/test,bundle/networking/src/test,bundle/presentation/src/test,bundle/hardware/src/test,app/src/test
sonar.sourceEncoding=UTF-8

# Exclude generated files and build artifacts
sonar.exclusions=**/build/**,**/generated/**,**/R.java,**/BuildConfig.java,**/**/*Companion*.kt,**/**/*_MembersInjector*.kt,**/**/*_Factory*.kt,**/**/*_HiltModules*.kt
sonar.test.exclusions=**/build/**,**/generated/**

# Kotlin & Jacoco Coverage settings (utiliza o relatório consolidado raiz)
sonar.kotlin.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml

# Detekt reports integration
sonar.kotlin.detekt.reportPaths=**/build/reports/detekt/detekt.xml

# Android-specific settings
sonar.android.lint.report=**/build/reports/lint-results-*.xml

# Quality gate settings
sonar.qualitygate.wait=true

# Unit test execution reports
sonar.kotlin.surefire.reportPaths=**/build/test-results/testDebugUnitTest/*.xml
sonar.junit.reportPaths=**/build/test-results/testDebugUnitTest/*.xml

# Analysis parameters
sonar.analysis.mode=publish
sonar.issuesReport.html.enable=true
sonar.issuesReport.json.enable=true
