name: 'Setup Android Build Environment'
description: 'Sets up JDK (Temurin), Android SDK, Gradle caching and permissions'

inputs:
  java-version:
    description: 'Java version to set up (17 or 21)'
    required: false
    default: '17'

runs:
  using: 'composite'
  steps:
    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'
        cache: gradle

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v4
