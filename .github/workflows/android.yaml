name: Android Publish Lib CoreAndroidNative

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate_and_build:
    name: Validate and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: 🔍 Run Detekt Static Analysis
        run: ./gradlew detekt

      - name: 🔎 Run Android Lint
        run: ./gradlew lintDebug

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: 🔨 Assemble AARs and APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: 📊 Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/lint-results*.html
          if-no-files-found: ignore

      - name: ⬆️ Upload Debug AARs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-aars
          path: |
            ./infra/*/build/outputs/aar/*-debug.aar
            ./bundle/*/build/outputs/aar/*-debug.aar

      - name: ⬆️ Upload Release AARs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-aars
          path: |
            ./infra/*/build/outputs/aar/*-release.aar
            ./bundle/*/build/outputs/aar/*-release.aar

  publish_and_release:
    name: Publish and Release
    needs: validate_and_build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed library modules
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files: |
            infra/**
            bundle/**

      - name: Grant execute permission for gradlew
        if: steps.changed_modules.outputs.any_changed == 'true'
        run: chmod +x gradlew

      - name: Set up JDK 17
        if: steps.changed_modules.outputs.any_changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK
        if: steps.changed_modules.outputs.any_changed == 'true'
        uses: android-actions/setup-android@v4

      # ─── Publicação dos Módulos ─────────────────────────────────────────────

      - name: 📦 Publish all modules to GitHub Packages
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish

      # ─── Tag e Release ─────────────────────────────────────────────────────

      - name: ⬇️ Download Release AARs
        if: steps.changed_modules.outputs.any_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-aars
          path: ./downloaded-release-aars

      - name: Configure GitHub Access
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Create Git Tag
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create Release
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          mapfile -t AAR_FILES < <(find ./downloaded-release-aars -type f -name "*-release.aar")
          if [ ${#AAR_FILES[@]} -gt 0 ]; then
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes "Release automático. Artefatos publicados individualmente no GitHub Packages:
              - br.com.wgc:core-common
              - br.com.wgc:core-storage
              - br.com.wgc:core-device
              - br.com.wgc:core-network
              - br.com.wgc:core-ui
              - br.com.wgc:core-database
              - br.com.wgc:core-location
              - br.com.wgc:core-camera
              - br.com.wgc:core-analytics
              - br.com.wgc:core-android-native (guarda-chuva)
              - br.com.wgc:bundle-persistence
              - br.com.wgc:bundle-networking
              - br.com.wgc:bundle-presentation
              - br.com.wgc:bundle-hardware
              Mudanças detectadas em: ${{ steps.changed_modules.outputs.all_changed_files }}." \
              "${AAR_FILES[@]}"
          else
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes "Release automático. Módulos publicados no GitHub Packages.
              Mudanças detectadas em: ${{ steps.changed_modules.outputs.all_changed_files }}."
          fi
