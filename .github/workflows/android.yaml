          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════════════════════
  # NÍVEL 6: PUBLICAÇÃO E DEPLOY POR CAMADA (Apenas em Push para Master)
  # ═════════════════════════════════════════════════════════════════════════════

  publish-infra:
    name: "🚀 Deploy Infra (Atomic Modules)"
    needs:
      - core-umbrella
      - sample-app
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production-infra
      url: https://github.com/${{ github.repository }}/releases
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed library modules
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files: |
            infra/**
            bundle/**

      - name: Setup Android & Java Environment
        if: steps.changed_modules.outputs.any_changed == 'true'
        uses: ./.github/actions/setup-android-env

      - name: 📦 Publish Infra modules to GitHub Packages
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :infra:core-common:publish :infra:core-storage:publish :infra:core-device:publish :infra:core-network:publish :infra:core-ui:publish :infra:core-database:publish :infra:core-location:publish :infra:core-camera:publish :infra:core-analytics:publish :infra:core:publish

      - name: ⬇️ Download Infra Release AARs
        if: steps.changed_modules.outputs.any_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-aar-core-*
          merge-multiple: true
          path: ./infra-release-aars

      - name: Configure GitHub Access
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: 🏷️ Calculate Semantic Version (SemVer)
        if: steps.changed_modules.outputs.any_changed == 'true'
        id: semver
        run: |
          LATEST_TAG=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)

            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s")
            if echo "$COMMITS" | grep -qE "(BREAKING CHANGE|feat!:)"; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif echo "$COMMITS" | grep -qE "^feat(\(.*\))?:"; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "Calculated SemVer Tag: $NEW_TAG"
          echo "tag_name=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.semver.outputs.tag_name }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create Release with Infra Artifacts
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.semver.outputs.tag_name }}"
          mapfile -t AAR_FILES < <(find ./infra-release-aars -type f -name "*-release.aar")
          if [ ${#AAR_FILES[@]} -gt 0 ]; then
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes "Release automático gerado pela esteira CI/CD (SemVer).
              Artefatos de infraestrutura publicados no GitHub Packages:
              - br.com.wgc:core-common
              - br.com.wgc:core-storage
              - br.com.wgc:core-device
              - br.com.wgc:core-network
              - br.com.wgc:core-ui
              - br.com.wgc:core-database
              - br.com.wgc:core-location
              - br.com.wgc:core-camera
              - br.com.wgc:core-analytics
              - br.com.wgc:core-android-native (guarda-chuva)
              Mudanças detectadas em: ${{ steps.changed_modules.outputs.all_changed_files }}." \
              "${AAR_FILES[@]}"
          else
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes "Release automático. Módulos de infraestrutura publicados no GitHub Packages.
              Mudanças detectadas em: ${{ steps.changed_modules.outputs.all_changed_files }}."
          fi

  publish-bundles:
    name: "🚀 Deploy Bundles"
    needs:
      - publish-infra
      - bundle-persistence
      - bundle-networking
      - bundle-presentation
      - bundle-hardware
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production-bundles
      url: https://github.com/${{ github.repository }}/releases
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed library modules
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files: |
            infra/**
            bundle/**

      - name: Setup Android & Java Environment
        if: steps.changed_modules.outputs.any_changed == 'true'
        uses: ./.github/actions/setup-android-env

      - name: 📦 Publish Bundles to GitHub Packages
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :bundle:persistence:publish :bundle:networking:publish :bundle:presentation:publish :bundle:hardware:publish

      - name: ⬇️ Download Bundle Release AARs
        if: steps.changed_modules.outputs.any_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-aar-bundle-*
          merge-multiple: true
          path: ./bundle-release-aars

      - name: Attach Bundle AARs to Release
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || git describe --tags --abbrev=0)
          mapfile -t AAR_FILES < <(find ./bundle-release-aars -type f -name "*-release.aar")
          if [ ${#AAR_FILES[@]} -gt 0 ]; then
            gh release upload "$LATEST_TAG" "${AAR_FILES[@]}" --clobber
          fi

  # ═════════════════════════════════════════════════════════════════════════════
  # NÍVEL 7: DEPLOY DE DOCUMENTAÇÃO DOKKA NO GITHUB PAGES
  # ═════════════════════════════════════════════════════════════════════════════

  deploy-docs:
    name: "🌐 Deploy Dokka Docs to GitHub Pages"
    needs: [publish-bundles]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env
      - name: 📚 Generate Dokka HTML
        run: ./gradlew dokkaHtml
      - name: 📁 Consolidate Documentation Pages
        run: |
          mkdir -p ./site-docs
          cp -r infra/core/build/dokka/html/* ./site-docs/ || true
          if [ ! -f ./site-docs/index.html ]; then
            find . -type d -path "*/build/dokka/html" -exec cp -r {}/* ./site-docs/ \;
          fi
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site-docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
