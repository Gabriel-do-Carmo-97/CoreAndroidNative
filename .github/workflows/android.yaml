name: Android Publish Lib CoreAndroidNative

on:
  push:
    branches: [ "master", "feat/**" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # ═════════════════════════════════════════════════════════════════════════════
  # NÍVEL 1: FUNDAÇÃO
  # ═════════════════════════════════════════════════════════════════════════════

  core-common:
    name: "infra: core-common"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env
      - name: 🛡️ Spotless Format & BCV API Check
        run: ./gradlew spotlessCheck apiCheck
      - name: 🔍 Detekt, Lint, Testes e Build
        run: ./gradlew :infra:core-common:detekt :infra:core-common:lintDebug :infra:core-common:testDebugUnitTest :infra:core-common:assembleRelease :infra:core-common:assembleDebug
      - name: 📊 Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-core-common
          path: |
            infra/core-common/build/reports/tests/
            infra/core-common/build/reports/detekt/
            infra/core-common/build/reports/lint-results*.html
          if-no-files-found: ignore
      - name: ⬆️ Upload Release AAR
        uses: actions/upload-artifact@v4
        with:
          name: release-aar-core-common
          path: infra/core-common/build/outputs/aar/*-release.aar
          if-no-files-found: error
      - name: ⬆️ Upload Debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: debug-aar-core-common
          path: infra/core-common/build/outputs/aar/*-debug.aar
          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════════════════════
  # NÍVEL 2: INFRA BÁSICA (Depende de core-common)
  # ═════════════════════════════════════════════════════════════════════════════

  core-storage:
    name: "infra: core-storage"
    needs: [core-common]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env
      - name: 🔍 Detekt, Lint, Testes e Build
        run: ./gradlew :infra:core-storage:detekt :infra:core-storage:lintDebug :infra:core-storage:testDebugUnitTest :infra:core-storage:assembleRelease :infra:core-storage:assembleDebug
      - name: 📊 Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-core-storage
          path: |
            infra/core-storage/build/reports/tests/
            infra/core-storage/build/reports/detekt/
            infra/core-storage/build/reports/lint-results*.html
          if-no-files-found: ignore
      - name: ⬆️ Upload Release AAR
        uses: actions/upload-artifact@v4
        with:
          name: release-aar-core-storage
